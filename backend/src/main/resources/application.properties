spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Google OAuth credentials and the account allowlist are supplied by the local
# run configuration or deployment environment. OAuth is disabled unless
# explicitly enabled and both credentials are present; protected endpoints remain
# inaccessible without an authenticated session.
google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.security.allowed-google-emails=${APP_ALLOWED_GOOGLE_EMAILS:}
app.security.session-cookie-secure=${SESSION_COOKIE_SECURE:true}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Session cookies are the browser's only authentication credential. Keep HTTPS
# enforced in deployments; set SESSION_COOKIE_SECURE=false only for local HTTP.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${app.security.session-cookie-secure}
server.servlet.session.cookie.same-site=lax
