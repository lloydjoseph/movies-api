name: Deploy production

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: Confirm a current production database backup exists
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require the production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deployments must be run from the main branch."
            exit 1
          fi

      - name: Require a production database backup
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          if [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "Create and verify a production database backup before deploying."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy tested commit
        run: |
          compose=(docker compose --env-file /etc/movies-api/production.env -f docker-compose.production.yml -p movies-production)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --build
          "${compose[@]}" ps
